name: flutter_dev_toolkit
description: "A modular in-app developer console for Flutter: logs, network inspector with mocking, crash reports, performance, storage, feature flags, and a plugin system."
version: 1.4.0
homepage: https://github.com/aayushkedawat/flutter_dev_toolkit
repository: https://github.com/aayushkedawat/flutter_dev_toolkit
issue_tracker: https://github.com/aayushkedawat/flutter_dev_toolkit/issues
documentation: https://github.com/aayushkedawat/flutter_dev_toolkit#readme


environment:
  sdk: ^3.7.0
  flutter: ">=1.17.0"

dependencies:
  dio: ">=5.2.0 <6.0.0"
  flutter:
    sdk: flutter
  flutter_bloc: ">=8.0.0 <10.0.0"
  bloc: ">=8.0.0 <10.0.0"
  http: ">=0.13.0 <2.0.0"
  share_plus: ">=11.0.0 <14.0.0"
  intl: ">=0.19.0 <=0.30.0"
  device_info_plus: ">=11.4.0 <14.0.0"
  shared_preferences: ">=2.2.0 <3.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints:

flutter:
topics:
  - debug
  - logger
  - network
  - developer-tools
  - flutter
